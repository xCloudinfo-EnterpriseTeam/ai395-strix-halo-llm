<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1118" width="1600" height="1118" font-family="Noto Sans TC, Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif"><rect width="1600" height="1118" fill="#F7F8FA"/><text x="50" y="62" font-size="34" font-weight="700" fill="#1F3864" text-anchor="start">Big models on one desktop box</text><rect x="50" y="76" width="150" height="3" fill="#BF181F"/><text x="50" y="112" font-size="20" font-weight="400" fill="#8A95A1" text-anchor="start">What you can run on a Ryzen AI Max+ 395, and how fast it answers</text><rect x="50" y="150" width="1370" height="170" rx="18" fill="#1F5FA8"/><text x="80" y="228" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">What you get</text><text x="80" y="260" font-size="17" font-weight="400" fill="#D5E3F3" text-anchor="start">all of it offline</text><rect x="290.0" y="170" width="172" height="130" rx="12" fill="#2B6CB5"/><g transform="translate(356.0,188) scale(1.6666666666666667)"><path d="M6 3 h8 l4 4 v14 H6 Z M14 3 v4 h4 M9 12 h6 M9 16 h6" fill="none" stroke="#FFFFFF" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"/></g><text x="376.0" y="272" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chat</text><rect x="477.6" y="170" width="172" height="130" rx="12" fill="#2B6CB5"/><g transform="translate(543.6,188) scale(1.6666666666666667)"><path d="M7 7 h10 v10 H7 Z M10 3 v4 M14 3 v4 M10 17 v4 M14 17 v4 M3 10 h4 M3 14 h4 M17 10 h4 M17 14 h4" fill="none" stroke="#FFFFFF" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"/></g><text x="563.6" y="272" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Coding</text><rect x="665.2" y="170" width="172" height="130" rx="12" fill="#2B6CB5"/><g transform="translate(731.2,188) scale(1.6666666666666667)"><path d="M11 4 a7 7 0 1 0 0.01 0 Z M16 16 L21 21" fill="none" stroke="#FFFFFF" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"/></g><text x="751.2" y="272" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Long docs</text><rect x="852.8" y="170" width="172" height="130" rx="12" fill="#2B6CB5"/><g transform="translate(918.8,188) scale(1.6666666666666667)"><path d="M12 3 L20 7.5 V16.5 L12 21 L4 16.5 V7.5 Z M4 7.5 L12 12 L20 7.5 M12 12 V21" fill="none" stroke="#FFFFFF" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"/></g><text x="938.8" y="272" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your apps</text><rect x="1040.4" y="170" width="172" height="130" rx="12" fill="#2B6CB5"/><g transform="translate(1106.4,188) scale(1.6666666666666667)"><path d="M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z M9 12 l2 2 l4 -4" fill="none" stroke="#FFFFFF" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1126.4" y="272" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stays local</text><rect x="1228.0" y="170" width="172" height="130" rx="12" fill="#2B6CB5"/><g transform="translate(1294.0,188) scale(1.6666666666666667)"><path d="M8 3 V8 M16 3 V8 M6 8 H18 V12 a6 6 0 0 1 -12 0 Z M12 18 V21" fill="none" stroke="#FFFFFF" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1314.0" y="272" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Desk sized</text><rect x="50" y="336" width="1370" height="250" rx="18" fill="#C9D9E9"/><text x="80" y="382" font-size="24" font-weight="700" fill="#1F3864" text-anchor="start">How fast</text><text x="80" y="412" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">measured on one box,</text><text x="80" y="438" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">nothing else running</text><rect x="80" y="512" width="196" height="44" rx="22" fill="#BF181F"/><text x="178" y="541" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Faster than you read</text><rect x="290" y="362" width="266" height="128" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><text x="312" y="400" font-size="21" font-weight="700" fill="#2E7BC4" text-anchor="start">Writes answers</text><text x="312" y="434" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">39 to 41 words a second</text><text x="312" y="462" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">on the 125B model</text><rect x="571" y="362" width="266" height="128" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><text x="593" y="400" font-size="21" font-weight="700" fill="#2E7BC4" text-anchor="start">Reads your prompt</text><text x="593" y="434" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">343 to 367 a second</text><text x="593" y="462" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">a long brief in 20 s</text><rect x="852" y="362" width="266" height="128" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><text x="874" y="400" font-size="21" font-weight="700" fill="#2E7BC4" text-anchor="start">Holds the thread</text><text x="874" y="434" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">32,000 words of context</text><text x="874" y="462" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">speed stays flat</text><rect x="1133" y="362" width="266" height="128" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><text x="1155" y="400" font-size="21" font-weight="700" fill="#2E7BC4" text-anchor="start">Ready to talk</text><text x="1155" y="434" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">80 seconds from cold</text><text x="1155" y="462" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">18 s for the other model</text><rect x="290" y="512" width="209" height="44" rx="22" fill="#FFFFFF" stroke="#8FA3B8" stroke-width="1.6"/><text x="394.5" y="541" font-size="18" font-weight="700" fill="#1F3864" text-anchor="middle">No subscription</text><rect x="513" y="512" width="231" height="44" rx="22" fill="#FFFFFF" stroke="#8FA3B8" stroke-width="1.6"/><text x="628.5" y="541" font-size="18" font-weight="700" fill="#1F3864" text-anchor="middle">No per-token bill</text><rect x="758" y="512" width="286" height="44" rx="22" fill="#FFFFFF" stroke="#8FA3B8" stroke-width="1.6"/><text x="901.0" y="541" font-size="18" font-weight="700" fill="#1F3864" text-anchor="middle">Works with no internet</text><rect x="1058" y="512" width="253" height="44" rx="22" fill="#FFFFFF" stroke="#8FA3B8" stroke-width="1.6"/><text x="1184.5" y="541" font-size="18" font-weight="700" fill="#1F3864" text-anchor="middle">You own the weights</text><rect x="50" y="602" width="1370" height="250" rx="18" fill="#DCE8F4"/><text x="80" y="648" font-size="24" font-weight="700" fill="#1F3864" text-anchor="start">What runs</text><text x="80" y="678" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">both are open weights</text><rect x="80" y="798" width="196" height="40" rx="20" fill="#BF181F"/><text x="178" y="825" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Two engines tested</text><rect x="290" y="628" width="266" height="198" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><g transform="translate(500,644) scale(1.4166666666666667)"><path d="M12 3 L20 7.5 V16.5 L12 21 L4 16.5 V7.5 Z M4 7.5 L12 12 L20 7.5 M12 12 V21" fill="none" stroke="#2E7BC4" stroke-width="2.08" stroke-linecap="round" stroke-linejoin="round"/></g><text x="312" y="668" font-size="21" font-weight="700" fill="#2E7BC4" text-anchor="start">The bigger one</text><text x="312" y="696" font-size="16" font-weight="400" fill="#8A95A1" text-anchor="start">284 billion parameters</text><rect x="308" y="714" width="230" height="40" rx="8" fill="#EEF3F9"/><text x="423.0" y="740" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="middle">13.5 to 15.4 a second</text><rect x="308" y="764" width="230" height="40" rx="8" fill="#EEF3F9"/><text x="423.0" y="790" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="middle">steady to 32,000 words</text><rect x="571" y="628" width="266" height="198" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><g transform="translate(781,644) scale(1.4166666666666667)"><path d="M7 7 h10 v10 H7 Z M10 3 v4 M14 3 v4 M10 17 v4 M14 17 v4 M3 10 h4 M3 14 h4 M17 10 h4 M17 14 h4" fill="none" stroke="#2E7BC4" stroke-width="2.08" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593" y="668" font-size="21" font-weight="700" fill="#2E7BC4" text-anchor="start">The faster one</text><text x="593" y="696" font-size="16" font-weight="400" fill="#8A95A1" text-anchor="start">125 billion parameters</text><rect x="589" y="714" width="230" height="40" rx="8" fill="#EEF3F9"/><text x="704.0" y="740" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="middle">39 to 41 a second</text><rect x="589" y="764" width="230" height="40" rx="8" fill="#EEF3F9"/><text x="704.0" y="790" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="middle">best for everyday work</text><rect x="852" y="628" width="266" height="198" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><g transform="translate(1062,644) scale(1.4166666666666667)"><path d="M6 3 h8 l4 4 v14 H6 Z M14 3 v4 h4 M9 12 h6 M9 16 h6" fill="none" stroke="#2E7BC4" stroke-width="2.08" stroke-linecap="round" stroke-linejoin="round"/></g><text x="874" y="668" font-size="21" font-weight="700" fill="#2E7BC4" text-anchor="start">Both fit</text><text x="874" y="696" font-size="16" font-weight="400" fill="#8A95A1" text-anchor="start">81 and 88 gigabytes</text><rect x="870" y="714" width="230" height="40" rx="8" fill="#EEF3F9"/><text x="985.0" y="740" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="middle">shrunk to 2 to 4 bits</text><rect x="870" y="764" width="230" height="40" rx="8" fill="#EEF3F9"/><text x="985.0" y="790" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="middle">quality kept where it counts</text><rect x="1133" y="628" width="266" height="198" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><g transform="translate(1343,644) scale(1.4166666666666667)"><path d="M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z M9 12 l2 2 l4 -4" fill="none" stroke="#2E7BC4" stroke-width="2.08" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1155" y="668" font-size="21" font-weight="700" fill="#2E7BC4" text-anchor="start">Picture reading</text><text x="1155" y="696" font-size="16" font-weight="400" fill="#8A95A1" text-anchor="start">available, not measured</text><rect x="1151" y="714" width="230" height="40" rx="8" fill="#EEF3F9"/><text x="1266.0" y="740" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="middle">vision builds exist</text><rect x="1151" y="764" width="230" height="40" rx="8" fill="#EEF3F9"/><text x="1266.0" y="790" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="middle">we only tested text</text><rect x="50" y="868" width="1370" height="200" rx="18" fill="#E8EDF3"/><text x="80" y="914" font-size="24" font-weight="700" fill="#1F3864" text-anchor="start">The box</text><text x="80" y="944" font-size="17" font-weight="400" fill="#3D4A57" text-anchor="start">one you can own</text><rect x="290" y="894" width="266" height="112" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><g transform="translate(310,912) scale(1.5833333333333333)"><path d="M7 7 h10 v10 H7 Z M10 3 v4 M14 3 v4 M10 17 v4 M14 17 v4 M3 10 h4 M3 14 h4 M17 10 h4 M17 14 h4" fill="none" stroke="#2E7BC4" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"/></g><text x="362" y="938" font-size="21" font-weight="700" fill="#1F3864" text-anchor="start">Ryzen AI Max+</text><text x="362" y="972" font-size="16" font-weight="400" fill="#3D4A57" text-anchor="start">the 395, Radeon 8060S</text><rect x="571" y="894" width="266" height="112" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><g transform="translate(591,912) scale(1.5833333333333333)"><path d="M12 3 L20 7.5 V16.5 L12 21 L4 16.5 V7.5 Z M4 7.5 L12 12 L20 7.5 M12 12 V21" fill="none" stroke="#2E7BC4" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"/></g><text x="643" y="938" font-size="21" font-weight="700" fill="#1F3864" text-anchor="start">128 GB</text><text x="643" y="972" font-size="16" font-weight="400" fill="#3D4A57" text-anchor="start">shared with graphics</text><rect x="852" y="894" width="266" height="112" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><g transform="translate(872,912) scale(1.5833333333333333)"><path d="M8 3 V8 M16 3 V8 M6 8 H18 V12 a6 6 0 0 1 -12 0 Z M12 18 V21" fill="none" stroke="#2E7BC4" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"/></g><text x="924" y="938" font-size="21" font-weight="700" fill="#1F3864" text-anchor="start">Desktop</text><text x="924" y="972" font-size="16" font-weight="400" fill="#3D4A57" text-anchor="start">no rack, no server room</text><rect x="1133" y="894" width="266" height="112" rx="12" fill="#FFFFFF" stroke="#C6D4E2" stroke-width="1.6"/><g transform="translate(1153,912) scale(1.5833333333333333)"><path d="M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z M9 12 l2 2 l4 -4" fill="none" stroke="#2E7BC4" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1205" y="938" font-size="21" font-weight="700" fill="#1F3864" text-anchor="start">Linux</text><text x="1205" y="972" font-size="16" font-weight="400" fill="#3D4A57" text-anchor="start">stock packages</text><text x="290" y="1040" font-size="16" font-weight="400" fill="#8A95A1" text-anchor="start">Figures are medians from the engines' own benchmarks on this machine; see the tables in the README</text><rect x="1440" y="150" width="112" height="918" rx="16" fill="#E8EDF3"/><text x="1496.0" y="245.75" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">U</text><text x="1496.0" y="271.75" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">S</text><text x="1496.0" y="297.75" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">E</text><text x="1496.0" y="462.25" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">F</text><text x="1496.0" y="488.25" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">A</text><text x="1496.0" y="514.25" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">S</text><text x="1496.0" y="540.25" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">T</text><line x1="1454" y1="379.5" x2="1538" y2="379.5" stroke="#C6D4E2" stroke-width="1.6"/><text x="1496.0" y="691.75" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">R</text><text x="1496.0" y="717.75" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">U</text><text x="1496.0" y="743.75" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">N</text><text x="1496.0" y="769.75" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">S</text><line x1="1454" y1="609.0" x2="1538" y2="609.0" stroke="#C6D4E2" stroke-width="1.6"/><text x="1496.0" y="934.25" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">B</text><text x="1496.0" y="960.25" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">O</text><text x="1496.0" y="986.25" font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">X</text><line x1="1454" y1="838.5" x2="1538" y2="838.5" stroke="#C6D4E2" stroke-width="1.6"/><text x="50" y="1096" font-size="15" font-weight="400" fill="#9AA7B4" text-anchor="start">xCloudinfo Corp. Limited（云碩科技）　　October 2026　　Published under CC BY 4.0　　github.com/xCloudinfo-EnterpriseTeam/ai395-strix-halo-llm</text></svg>